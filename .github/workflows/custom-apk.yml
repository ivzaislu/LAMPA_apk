name: Custom APK

on:
  push:
    branches:
      - optimize-tv-channel-updates
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build custom Lite debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare temporary signing config
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/lampa-ci.jks" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          echo "KEYSTORE_FILE=$RUNNER_TEMP/lampa-ci.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "RELEASE_SIGN_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "RELEASE_SIGN_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Verify Android TV OFF guard coverage
        run: python3 scripts/verify_tv_channels_off.py

      - name: Compile APK and instrumentation tests
        run: ./gradlew assembleLiteDebug assembleLiteDebugAndroidTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lampa-custom-lite-debug
          path: app/build/outputs/apk/lite/debug/app-lite-debug.apk
          if-no-files-found: error
          retention-days: 14

  verify-tv-channels-off:
    name: Verify Android TV channels are really OFF
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare temporary signing config
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/lampa-ci.jks" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          echo "KEYSTORE_FILE=$RUNNER_TEMP/lampa-ci.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "RELEASE_SIGN_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "RELEASE_SIGN_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Verify source guards before emulator
        run: python3 scripts/verify_tv_channels_off.py

      - name: Run OFF/ON tests on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: ./gradlew connectedLiteDebugAndroidTest --stacktrace
