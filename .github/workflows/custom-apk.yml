name: Custom APK

on:
  push:
    branches:
      - optimize-tv-channel-updates
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build custom Lite debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle


      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build Lite debug APK
        run: ./gradlew assembleLiteDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lampa-custom-lite-debug
          path: app/build/outputs/apk/lite/debug/app-lite-debug.apk
          if-no-files-found: error
          retention-days: 14
